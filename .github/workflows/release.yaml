name: Release GPUI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH, newer than the latest published release)'
        required: true
        type: string

concurrency:
  group: mdit-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version before signing or building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          previous=$(gh release view --repo hjinco/mdit --json tagName --jq .tagName)
          python3 tooling/release/release.py validate-version "$RELEASE_VERSION" --previous "$previous"
      - name: Test release metadata
        run: python3 -m unittest discover -s tooling/release -p 'test_*.py'

  build:
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: gpui-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check signing configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          names = ('SPARKLE_PUBLIC_KEY', 'SPARKLE_PRIVATE_KEY', 'APPLE_SIGNING_IDENTITY',
                   'APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'KEYCHAIN_PASSWORD',
                   'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID', 'TAURI_SIGNING_PRIVATE_KEY')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing release configuration: ' + ', '.join(missing))
          PY
      - name: Download pinned Sparkle distribution
        run: python3 tooling/release/download_sparkle.py
      - name: Build GPUI
        run: cargo build -p mdit-desktop --release --target "$BUILD_TARGET" --locked
      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/mdit-certificate.p12"
          keychain="$RUNNER_TEMP/mdit-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 21600 -u "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          rm "$certificate"
      - name: Bundle, sign, notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 tooling/release/release.py bundle \
            --version "$RELEASE_VERSION" --target "$BUILD_TARGET" \
            --binary "target/$BUILD_TARGET/release/mdit-desktop" \
            --output target/bundle --identity "$APPLE_SIGNING_IDENTITY" --notarize
      - name: Create and sign Tauri and Sparkle updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 tooling/release/release.py artifacts \
            --target "$BUILD_TARGET" --app target/bundle/Mdit.app --output target/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-${{ matrix.target }}
          path: target/artifacts/*
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mdit-certificate.p12"
          if [ -f "$RUNNER_TEMP/mdit-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/mdit-signing.keychain-db"
          fi

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gpui-*
          merge-multiple: true
          path: release-assets
      - name: Generate legacy Tauri update manifest
        run: python3 tooling/release/release.py manifest --version "$RELEASE_VERSION" --directory release-assets
      - name: Create draft only after both architectures succeed
        run: |
          gh release create "v$RELEASE_VERSION" release-assets/* \
            --target "$GITHUB_SHA" --draft --title "Mdit $RELEASE_VERSION" \
            --notes-file apps/desktop/RELEASE_NOTES.md
