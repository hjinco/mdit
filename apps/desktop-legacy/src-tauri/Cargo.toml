[package]
name = "mdit"
version = "0.0.0"
description = "Mdit"
authors = ["hhhjin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
app-storage = { path = "../../../crates/app-storage" }
mdit-credentials = { package = "credentials", path = "../../../crates/credentials" }
mdit-image-processing = { package = "image-processing", path = "../../../crates/image-processing" }
mdit-vault-indexing = { package = "vault-indexing", path = "../../../crates/vault-indexing" }
mdit-vault-indexer = { package = "vault-indexer", path = "../../../crates/vault-indexer" }
mdit-note = { package = "note", path = "../../../crates/note" }
mdit-ollama-client = { package = "ollama-client", path = "../../../crates/ollama-client" }
mdit-vault-watch = { package = "vault-watch", path = "../../../crates/vault-watch" }
tauri = { version = "2.12.5", features = [ "macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
glob = "0.3.4"
same-file = "1.0.6"
hex = "0.4.3"
sha2 = "0.11.1"
tempfile = "3.27.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = { version = "2.7.1" }
tauri-plugin-keyring = "0.1.0"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-process = "2.4.0"
trash = "5.3.0"
tauri-plugin-shell = "2.6.0"
tauri-plugin-os = "2.4.0"
anyhow = "1.0.104"
tauri-plugin-clipboard = "2.1.11"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-http = "2.9.0"
urlencoding = "2.1.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSButton", "NSControl", "NSView", "NSWindow"] }
