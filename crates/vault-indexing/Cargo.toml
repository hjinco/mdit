[package]
name = 'vault-indexing'
version = '0.1.0'
edition.workspace = true

[dependencies]
anyhow = '1.0.104'
app-storage = { path = '../app-storage' }
blake3 = '1.8.7'
note = { path = '../note' }
ollama-client = { path = '../ollama-client' }
pulldown-cmark = { version = '0.13.6', default-features = false, features = ['simd'] }
rusqlite = { version = '0.41.1', features = ['bundled'] }
serde = { version = '1.0.229', features = ['derive'] }
serde_yaml = '0.9.34'
tiktoken-rs = '0.12.1'
walkdir = '2.5.0'
vault-indexing-api = { path = '../vault-indexing-api' }
