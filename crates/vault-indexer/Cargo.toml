[package]
name = "vault-indexer"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
vault-indexing-api = { path = "../vault-indexing-api" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
vault-watch = { path = "../vault-watch" }
regex = "1.13.1"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["simd"] }
pathdiff = "0.2.3"
